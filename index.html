<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flexlogg">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Flexlogg</title>
<style>
:root{
  --in:#2f6fde;--out:#cc6618;
  --bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#6b717c;--line:#e3e5ea;--accent:#2f6fde;
  --ok:#2e9e6a;--warn:#c9761a;--bad:#c2413a;--chip:#eceef2;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1114;--card:#1a1d22;--ink:#eef0f3;--mute:#9298a3;--line:#2a2e35;--chip:#262a31;--in:#5b8ff0;--out:#d8732c}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
header h1{font-size:22px;margin:0;letter-spacing:-.02em}
.sync{font-size:12px;color:var(--mute)}
.sync.ok{color:var(--ok)} .sync.err{color:var(--bad)}
main{padding:0 14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.mute{color:var(--mute)} .small{font-size:13px}
.big{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.today{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.today div span{display:block;font-size:12px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:var(--card)}
.stampshow{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.stampshow.custom{color:var(--warn)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
input[type=color]{padding:0;width:34px;height:34px;border-radius:50%;overflow:hidden;border:0;background:none}
.group{margin:12px 0}
.btn-main{width:100%;border:2px solid var(--c);background:var(--card);color:var(--ink);border-radius:18px;padding:16px;text-align:left;font:inherit;display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn-main b{font-size:19px}
.btn-main.on{background:var(--c);color:#fff}
.btn-main.on .mute{color:rgba(255,255,255,.85)}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;padding-left:12px;border-left:3px solid var(--c)}
.btn-sub{border:1.5px solid var(--c);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 12px;text-align:left;font:inherit;min-height:62px}
.btn-sub b{display:block;font-size:15px}
.btn-sub.on{background:var(--c);color:#fff}
.btn-sub.on .mute{color:rgba(255,255,255,.85)}
.run{font-variant-numeric:tabular-nums}
.sectionlbl{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 4px 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mute);font:inherit;font-size:11px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}
.navbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.navbar button{border:0;background:var(--chip);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit}
.navbar .ttl{font-weight:650;text-align:center;flex:1}
.entry{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.entry .t{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.danger{background:var(--bad)}
.btn.block{width:100%}
.day{padding:10px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.prop{font-variant-numeric:tabular-nums;font-weight:650}
.tag{font-size:12px;background:var(--chip);border-radius:6px;padding:2px 6px;color:var(--mute)}
.tag.warn{color:var(--warn)}
.copy{border:0;background:var(--chip);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px}
.catrow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .sub2{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.catrow input[type=text]{width:100%}
.icon{border:0;background:var(--chip);color:var(--ink);border-radius:8px;width:32px;height:32px;font-size:15px}
.hours{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.hours input[type=time]{width:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px}
.sheet label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.empty{color:var(--mute);text-align:center;padding:20px 0}
.help{font-size:13px;color:var(--mute);margin:6px 0 0}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;padding:7px 0;border-radius:8px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chart{width:100%;height:auto;display:block;margin-top:6px;touch-action:manipulation}
.chart text{font-size:9px;fill:var(--mute)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chartinfo{min-height:38px;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.srow{padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .bar{height:6px;border-radius:3px;background:var(--chip);margin-top:5px;overflow:hidden}
.srow .bar i{display:block;height:100%;border-radius:3px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sched{margin:10px 0}
.sched .hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1 id="htitle">Stämpla</h1>
  <span class="sync" id="sync"></span>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="stampla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Stämpla</button>
  <button data-tab="logg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Logg</button>
  <button data-tab="flex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 14h4M7 17h7"/></svg>Flex</button>
  <button data-tab="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistik</button>
  <button data-tab="inst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Inställningar</button>
</nav>
<div id="modalRoot"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const clone = o => JSON.parse(JSON.stringify(o));
const MIN = 60000;
const WD = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
const WDL = ['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];
const PALETTE = ['#2f6fde','#e0782f','#2e9e6a','#8a5cd1','#d14b7a','#1f9bb0','#b59a1a','#7a7f87'];
const pad = n => String(n).padStart(2, '0');
const dayStart = ms => { const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
const addDays = (ms, n) => { const d = new Date(ms); d.setDate(d.getDate() + n); return d.getTime(); };
const wdIdx = ms => (new Date(ms).getDay() + 6) % 7;
const weekMonday = ms => { const d = dayStart(ms); return addDays(d, -wdIdx(d)); };
const hm2ms = (day, hm) => { const [h, m] = (hm || '00:00').split(':').map(Number); const d = new Date(day); d.setHours(h, m, 0, 0); return d.getTime(); };
const clock = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dm = ms => { const d = new Date(ms); return d.getDate() + '/' + (d.getMonth() + 1); };
const dk = ms => { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dkToMs = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const mk = ms => { const d = new Date(ms); return 'm-' + d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const toInput = ms => { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fromInput = s => { if (!s) return null; const t = new Date(s).getTime(); return isNaN(t) ? null : t; };
function fmtDur(ms) { const m = Math.round(ms / MIN); const h = Math.floor(m / 60), r = m % 60; return h ? (h + ' h ' + pad(r) + ' min') : (r + ' min'); }
function fmtRun(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }
function isoWeek(ms) { const d = new Date(ms); d.setHours(0,0,0,0); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7); }
function longDate(ms) { return new Date(ms).toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' }); }

/* ---------- state ---------- */
const DEFAULT_SETTINGS = {
  categories: [
    { id: 'arbete', name: 'Arbete', type: 'work', color: '#2f6fde' },
    { id: 'elev', name: 'Elevtid', type: 'sub', parent: 'arbete', color: '#e0782f' },
    { id: 'plan', name: 'Planering', type: 'sub', parent: 'arbete', color: '#2e9e6a' },
    { id: 'ratt', name: 'Rättning', type: 'sub', parent: 'arbete', color: '#8a5cd1' },
    { id: 'ejarb', name: 'Ej arbetstid', type: 'other', color: '#7a7f87' }
  ],
  hours: [0,1,2,3,4,5,6].map(i => ({ on: i < 5, start: '07:30', end: '16:30' })),  // bara mall/migrering
  lunch: 0,
  offDays: 'separate'
};
let S = normalizeSettings({});
const APP_VERSION = 'v13';   // håll lika med CACHE i sw.js
let E = [];
let T = {};        // överfört till flexappen: dag -> {at, in, out, dur}
let tab = 'stampla';
let SM = { kind: 'now' };          // stamp-time mode
let logDay = dayStart(Date.now()), logWeek = weekMonday(Date.now());
let flexWeek = weekMonday(Date.now());
let needsRender = false;

function normalizeSettings(s) {
  const o = Object.assign(clone(DEFAULT_SETTINGS), s || {});
  if (!Array.isArray(o.categories)) o.categories = clone(DEFAULT_SETTINGS.categories);
  if (!Array.isArray(o.hours) || o.hours.length !== 7) o.hours = clone(DEFAULT_SETTINGS.hours);
  // normal arbetstid lagras som scheman med giltighetsdatum ('' = från början)
  if (!Array.isArray(o.schedules) || !o.schedules.length) o.schedules = [{ from: '', hours: o.hours }];
  o.schedules = o.schedules.filter(x => x && Array.isArray(x.hours) && x.hours.length === 7);
  if (!o.schedules.length) o.schedules = [{ from: '', hours: clone(DEFAULT_SETTINGS.hours) }];
  o.schedules.sort((a, b) => (a.from || '').localeCompare(b.from || ''));
  o.schedules[0].from = '';
  delete o.hours;
  o.lunch = Math.max(0, Number(o.lunch) || 0);
  return o;
}
function schedIdxFor(day) { const k = dk(day); let j = 0; S.schedules.forEach((sc, i) => { if ((sc.from || '') <= k) j = i; }); return j; }
const hoursFor = day => S.schedules[schedIdxFor(day)].hours[wdIdx(day)];
const cat = id => S.categories.find(c => c.id === id);
const isWork = c => !!c && (c.type === 'work' || c.type === 'sub');
const activeOf = id => E.find(e => e.cat === id && e.end == null);
const parentOf = c => (c && c.type === 'sub' && c.parent && cat(c.parent) && cat(c.parent).type === 'work') ? cat(c.parent) : null;

/* ---------- local storage ---------- */
const LSK = 'flexlogg-v1';
let dirty = new Set(), ver = {}, writing = {}, knownKeys = new Set();
function saveLocal() {
  try { localStorage.setItem(LSK, JSON.stringify({ S, E, T, tab })); storageOK = true; } catch (e) { storageOK = false; }
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(LSK); if (!raw) return;
    const o = JSON.parse(raw);
    if (o.S) S = normalizeSettings(o.S);
    if (Array.isArray(o.E)) E = o.E;
    if (o.T && typeof o.T === 'object') T = o.T;
    if (Array.isArray(o.dirty)) o.dirty.forEach(k => markDirty(k));
    if (o.tab) tab = o.tab;
  } catch (e) {}
}

/* ---------- lagring: endast i den här telefonen ---------- */
let storageOK = true;
const LBK = 'flexlogg-lastbackup';
function lastBackup() { try { return Number(localStorage.getItem(LBK)) || 0; } catch (e) { return 0; } }
function setSync() {
  const el = $('#sync');
  if (!storageOK) { el.textContent = 'Kan inte spara!'; el.className = 'sync err'; return; }
  const lb = lastBackup();
  const old = E.length && (!lb || Date.now() - lb > 14 * 864e5);
  el.textContent = old ? 'Dags för säkerhetskopia' : 'Sparas i telefonen';
  el.className = 'sync ' + (old ? 'err' : 'ok');
}
function markDirty() {}
function markAllDirty() {}
function commit() { saveLocal(); setSync(); }
const commitEntries = (...entries) => commit([...new Set(entries.filter(x => x != null).map(x => typeof x === 'number' ? mk(x) : mk(x.start)))]);
const commitSettings = () => commit(['settings']);

/* ---------- calculations ---------- */
function merge(iv) {
  iv = iv.filter(([s, e]) => e > s).sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const [s, e] of iv) {
    if (out.length && s <= out[out.length - 1][1]) out[out.length - 1][1] = Math.max(out[out.length - 1][1], e);
    else out.push([s, e]);
  }
  return out;
}
const sumIv = iv => iv.reduce((a, [s, e]) => a + (e - s), 0);
const clip = (iv, a, b) => iv.map(([s, e]) => [Math.max(s, a), Math.min(e, b)]).filter(([s, e]) => e > s);

/* Tar bort tidsspannen i cut (sorterade, sammanslagna) ur iv. */
function subtractIv(iv, cut) {
  if (!cut.length) return iv;
  const out = [];
  for (let [s, e] of iv) {
    for (const [cs, ce] of cut) {
      if (ce <= s || cs >= e) continue;
      if (cs > s) out.push([s, cs]);
      s = Math.max(s, ce);
      if (s >= e) break;
    }
    if (s < e) out.push([s, e]);
  }
  return out;
}
/* Ej arbetstid (t.ex. lunch) som ligger över arbetstid dras av från arbetstiden. */
const offIv = (rel, d0, d1, now) => merge(clip(rel.filter(e => (cat(e.cat) || {}).type === 'other').map(e => [e.start, e.end ?? now]), d0, d1));

function daySummary(day) {
  const d0 = day, d1 = addDays(day, 1), now = Date.now();
  const rel = E.filter(e => e.start < d1 && (e.end ?? now) > d0);
  const off = offIv(rel, d0, d1, now);
  const work = subtractIv(merge(clip(rel.filter(e => isWork(cat(e.cat))).map(e => [e.start, e.end ?? now]), d0, d1)), off);
  const total = sumIv(work);
  const h = hoursFor(day);
  let win = null, inside = 0;
  if (h && h.on && h.start < h.end) { win = [hm2ms(day, h.start), hm2ms(day, h.end)]; inside = sumIv(clip(work, win[0], win[1])); }
  const byCat = {};
  S.categories.forEach(c => {
    const iv = merge(clip(rel.filter(e => e.cat === c.id).map(e => [e.start, e.end ?? now]), d0, d1));
    const t = sumIv(c.type === 'other' ? iv : subtractIv(iv, off));
    if (t > 0) byCat[c.id] = t;
  });
  return { day, total, inside, outside: total - inside, win, first: work.length ? work[0][0] : null, byCat, entries: rel };
}
function proposal(sum, extra) {
  const durMin = Math.round((sum.total + (extra || 0)) / MIN);
  if (!sum.win || durMin <= 0) return null;
  const [ws, we] = sum.win;
  const dur = durMin * MIN, lunch = S.lunch * MIN;
  let inT = (sum.first != null && sum.first >= ws && sum.first < we) ? Math.floor(sum.first / MIN) * MIN : ws;
  let outT = inT + dur + lunch;
  if (outT > we) { inT = Math.max(ws, we - dur - lunch); outT = inT + dur + lunch; }
  return { in: inT, out: outT, dur, over: Math.max(0, outT - we) };
}
/* Veckans förslag. Tid på dagar utan flexram (helg) och det som inte ryms en dag fördelas
   bakåt: fredag fylls först, överskottet går till dagen före (bara dagar med loggad tid) osv.
   Det som inte ryms på veckan alls hamnar i `over` (läggs på annan vecka i jobbappen). */
function weekData(mon) {
  const days = [0,1,2,3,4,5,6].map(i => daySummary(addDays(mon, i)));
  const lunch = S.lunch * MIN;
  let carry = days.reduce((a, s) => a + (s.win ? 0 : s.total), 0);
  const extra = Array(7).fill(0), recv = Array(7).fill(0), out = Array(7).fill(0);
  for (let i = 6; i >= 0; i--) {
    const s = days[i];
    if (!s.win || s.total <= 0) continue;
    const cap = Math.max(0, Math.floor((s.win[1] - s.win[0]) / MIN) * MIN - lunch);
    const amount = s.total + carry, fit = Math.min(amount, cap);
    extra[i] = fit - s.total;
    recv[i] = Math.max(0, fit - s.total);
    carry = amount - fit; out[i] = carry;
  }
  const props = days.map((s, i) => proposal(s, extra[i]));
  const total = days.reduce((a, s) => a + s.total, 0);
  const outside = days.reduce((a, s) => a + s.outside, 0);
  return { days, extra, recv, out, over: carry, props, total, outside };
}

/* ---------- stamping ---------- */
function stampTime() {
  const n = Date.now();
  if (SM.kind === 'offset') return n - SM.min * MIN;
  if (SM.kind === 'abs') return SM.ms;
  return n;
}
function stopEntry(e, t) { e.end = Math.max(t, e.start); }
function press(catId) {
  const c = cat(catId); if (!c) return;
  const t = stampTime();
  if (t > Date.now() + MIN) { toast('Stämpeltiden ligger i framtiden.'); return; }
  const act = activeOf(catId);
  const touched = [];
  let noteFor = null;
  if (act) {
    noteFor = act;
    if (t < act.start) { toast('Sluttiden är före starttiden (' + clock(act.start) + ').'); return; }
    stopEntry(act, t); touched.push(act);
    if (c.type === 'sub') {
      const p = parentOf(c), pa = p && activeOf(p.id);
      const otherSubs = E.some(e => e.end == null && cat(e.cat) && cat(e.cat).parent === c.parent);
      if (pa && pa.startedBy === act.id && !otherSubs) { stopEntry(pa, t); touched.push(pa); }
    } else if (c.type === 'work') {
      E.filter(e => e.end == null && cat(e.cat) && cat(e.cat).type === 'sub' && cat(e.cat).parent === catId)
        .forEach(e => { stopEntry(e, t); touched.push(e); });
    }
    toast(c.name + ' stoppad ' + clock(t));
  } else {
    const ne = { id: newId(), cat: catId, start: t, end: null };
    if (c.type === 'sub') {
      const p = parentOf(c);
      // byter man delkategori stoppas den som pågår under samma huvudkategori
      E.filter(e => e.end == null && cat(e.cat) && cat(e.cat).type === 'sub' && cat(e.cat).parent === c.parent).forEach(e => {
        stopEntry(e, t); touched.push(e);
        noteFor = noteFor || e;
        const pa = p && activeOf(p.id);
        if (pa && pa.startedBy === e.id) { pa.startedBy = ne.id; touched.push(pa); }
      });
      if (p && !activeOf(p.id)) { const pe = { id: newId(), cat: p.id, start: t, end: null, startedBy: ne.id }; E.push(pe); touched.push(pe); }
    }
    E.push(ne); touched.push(ne);
    toast(c.name + ' startad ' + clock(t));
  }
  SM = { kind: 'now' };
  commitEntries(...touched);
  render();
  if (noteFor && (cat(noteFor.cat) || {}).note) askNote(noteFor);
}
function recentNotes(n, catId) {
  const seen = [];
  E.filter(e => e.note && e.cat === catId).sort((a, b) => (b.end ?? b.start) - (a.end ?? a.start)).forEach(e => { if (!seen.includes(e.note) && seen.length < n) seen.push(e.note); });
  return seen;
}
function askNote(e) {
  const c = cat(e.cat) || { name: '' };
  const sug = recentNotes(5, e.cat);
  openModal('<h3>' + esc(c.name) + '</h3>' +
    '<label>' + esc(c.notePrompt || 'Kommentar') + ' <span class="small mute">(valfritt)</span></label>' +
    '<input type="text" id="nTxt" maxlength="200" value="' + esc(e.note || '') + '">' +
    (sug.length ? '<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">' + sug.map((s, i) => '<button class="chip" data-sug="' + i + '">' + esc(s) + '</button>').join('') + '</div>' : '') +
    '<div class="row" style="margin-top:16px;gap:8px"><button class="btn sec" id="nSkip" style="margin-left:auto">Hoppa över</button><button class="btn" id="nSave">Spara</button></div>', r => {
    const inp = r.querySelector('#nTxt');
    r.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => { inp.value = sug[b.dataset.sug]; inp.focus(); });
    r.querySelector('#nSkip').onclick = closeModal;
    const save = () => { const v = inp.value.trim(); if (v) e.note = v; else delete e.note; commitEntries(e); closeModal(); render(); };
    r.querySelector('#nSave').onclick = save;
    inp.onkeydown = ev => { if (ev.key === 'Enter') save(); };
    inp.focus();
  });
}

/* Poster som hör ihop med e: för en delpost huvudposten den startade (startedBy),

function dependents(e) {
  const c = cat(e.cat), end = x => x.end ?? Infinity, all = [], partial = [];
  if (c && c.type === 'sub') E.forEach(x => { if (x.id !== e.id && x.startedBy === e.id) all.push(x); });
  else if (c && c.type === 'work') E.forEach(x => {
    const xc = cat(x.cat);
    if (x.id === e.id || !xc || xc.type !== 'sub' || xc.parent !== c.id || !(x.start < end(e) && end(x) > e.start)) return;
    (x.start >= e.start && end(x) <= end(e) ? all : partial).push(x);

}

}

/* ---------- view: flex ---------- */
/* ---------- överfört till flexappen ---------- */
function weekItems(w, mon) {
  const items = [];
  w.days.forEach((s, i) => {
    const p = w.props[i], key = dk(s.day);
    if (p) items.push({ key, i, label: WD[i] + ' ' + dm(s.day), cur: { in: p.in, out: p.out, dur: p.dur } });
    else if (T[key]) items.push({ key, i, label: WD[i] + ' ' + dm(s.day), cur: null });
  });
  const sk = 'sep-' + dk(mon);
  if (w.over >= MIN) items.push({ key: sk, i: -1, label: 'Ryms inte i veckan', cur: { dur: Math.round(w.over / MIN) * MIN } });
  else if (T[sk]) items.push({ key: sk, i: -1, label: 'Ryms inte i veckan', cur: null });
  items.forEach(it => {
    const t = T[it.key];
    it.state = !t ? 'open' : (it.cur && t.in === it.cur.in && t.out === it.cur.out && t.dur === it.cur.dur ? 'done' : 'changed');
  });
  return items;
}
function markItem(it) { T[it.key] = Object.assign({ at: Date.now() }, it.cur || {}); }
function pendingOverview() {
  if (!E.length) return null;
  const today = dayStart(Date.now()), thisMon = weekMonday(today);
  let mon = weekMonday(Math.min(...E.map(e => e.start))), count = 0, first = null;
  for (let n = 0; mon <= thisMon && n < 520; mon = addDays(mon, 7), n++) {
    weekItems(weekData(mon), mon).forEach(it => {
      if (it.state === 'done') return;
      const past = it.i >= 0 ? addDays(mon, it.i) < today : mon < thisMon;
      if (!past) return;
      count++; if (first == null) first = mon;
    });
  }
  return count ? { count, first } : null;
}
function itemLine(it) {
  if (!it.cur) return it.label + ': ingen tid längre';
  if (it.i < 0) return 'Ryms inte i veckan, lägg på annan vecka: ' + fmtDur(it.cur.dur);
  return it.label + ': In ' + clock(it.cur.in) + '  Ut ' + clock(it.cur.out) + '  (' + fmtDur(it.cur.dur) + ')';
}
function weekText(w, mon) {
  const items = weekItems(w, mon).filter(it => it.cur);
  const pend = items.filter(it => it.state !== 'done');
  const use = pend.length ? pend : items;
  const lines = ['Vecka ' + isoWeek(mon) + ' (' + dm(mon) + '–' + dm(addDays(mon, 6)) + ')'];
  use.forEach(it => lines.push(itemLine(it) + (it.state === 'changed' ? '  [ändrad]' : '')));
  if (!pend.length) lines.push('Total arbetstid: ' + fmtDur(w.total));
  return lines.join('\n');
}

function viewFlex() {

  const pend = items.filter(it => it.state !== 'done' && it.cur);

/* ---------- view: statistik ---------- */
let statKind = 'month', statAnchor = Date.now(), chartMode = 'inout', statSel = null;
const MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
function periodRange(kind, a) {

  if (kind === 'half') return m < 6 ? [new Date(y, 0, 1).getTime(), new Date(y, 6, 1).getTime()] : [new Date(y, 6, 1).getTime(), new Date(y + 1, 0, 1).getTime()];

function periodLabel(kind, s) {

  if (kind === 'week') return 'Vecka ' + isoWeek(s) + ', ' + new Date(addDays(s, 3)).getFullYear();
  if (kind === 'month') return MONTHS[d.getMonth()] + ' ' + y;
  if (kind === 'half') return (d.getMonth() < 6 ? 'Januari–juni ' : 'Juli–december ') + y;

}
function statGroups() {
  // huvudkategorier med sina delkategorier; delkategorier utan giltig huvudkategori blir egna grupper
  const groups = [];
  S.categories.filter(c => c.type === 'work').forEach(c => groups.push({ main: c, subs: S.categories.filter(x => x.type === 'sub' && x.parent === c.id) }));
  S.categories.filter(c => c.type === 'sub' && !parentOf(c)).forEach(c => groups.push({ main: c, subs: [] }));
  return groups;
}
function computeStats(p0, p1) {
  const now = Date.now(), groups = statGroups();
  const pre = E.filter(e => e.start < p1 && (e.end ?? now) > p0);
  const z = () => ({ tot: 0, out: 0 });
  const R = { work: z(), groups: groups.map(g => ({ g, all: z(), subs: g.subs.map(() => z()), rest: z() })), other: {}, buckets: [] };
  const bucketed = statKind === 'year' || statKind === 'half';
  const bmap = new Map();
  for (let day = dayStart(p0); day < p1; day = addDays(day, 1)) {
    const d1 = addDays(day, 1);
    const rel = pre.filter(e => e.start < d1 && (e.end ?? now) > day);
    const h = hoursFor(day);
    const win = (h && h.on && h.start < h.end) ? [hm2ms(day, h.start), hm2ms(day, h.end)] : null;
    const off = offIv(rel, day, d1, now);
    const ivRaw = ids => merge(clip(rel.filter(e => ids.includes(e.cat)).map(e => [e.start, e.end ?? now]), day, d1));
    const ivOf = ids => subtractIv(ivRaw(ids), off);
    const measure = iv => { const tot = sumIv(iv); const inside = win ? sumIv(clip(iv, win[0], win[1])) : 0; return { tot, out: tot - inside }; };
    const add = (acc, m) => { acc.tot += m.tot; acc.out += m.out; };
    const bk = bucketed ? weekMonday(day) : day;
    if (!bmap.has(bk)) { const b = { start: bk, tot: 0, out: 0, seg: {} }; bmap.set(bk, b); R.buckets.push(b); }
    const b = bmap.get(bk);
    if (!rel.length) continue;
    const wm = measure(subtractIv(merge(clip(rel.filter(e => isWork(cat(e.cat))).map(e => [e.start, e.end ?? now]), day, d1)), off));
    add(R.work, wm); b.tot += wm.tot; b.out += wm.out;
    R.groups.forEach(G => {
      const all = measure(ivOf([G.g.main.id, ...G.g.subs.map(x => x.id)]));
      if (!all.tot) return;
      add(G.all, all);
      let su = { tot: 0, out: 0 };
      G.g.subs.forEach((sc, k) => { const m = measure(ivOf([sc.id])); add(G.subs[k], m); b.seg[sc.id] = (b.seg[sc.id] || 0) + m.tot; });
      if (G.g.subs.length) su = measure(ivOf(G.g.subs.map(x => x.id)));
      const rest = { tot: all.tot - su.tot, out: all.out - su.out };
      add(G.rest, rest); b.seg['rest:' + G.g.main.id] = (b.seg['rest:' + G.g.main.id] || 0) + rest.tot;
    });
    S.categories.filter(c => c.type === 'other').forEach(c => { const m = measure(ivRaw([c.id])); if (m.tot) R.other[c.id] = (R.other[c.id] || 0) + m.tot; });

}
const pct = (a, b) => b > 0 ? Math.round(100 * a / b) : 0;

    '<div class="bar"><i style="width:' + Math.min(100, p) + '%;background:' + esc(color) + '"></i></div>' +
    (outVal != null && val > 0 ? '<div class="small mute">varav ' + pct(outVal, val) + ' % utanför normaltid (' + fmtDur(outVal) + ')</div>' : '') + '</div>';
}
function chartSegments(R) {

  R.groups.forEach(G => {
    if (!G.all.tot) return;
    G.g.subs.forEach((sc, k) => { if (G.subs[k].tot) segs.push({ key: sc.id, name: sc.name, color: sc.color }); });
    if (G.rest.tot > 0) segs.push({ key: 'rest:' + G.g.main.id, name: G.g.subs.length ? 'Övrigt ' + G.g.main.name.toLowerCase() : G.g.main.name, color: G.g.main.color });

}

  const step = maxH <= 10 ? 2 : maxH <= 25 ? 5 : maxH <= 60 ? 10 : 20;

    h += '</div></div>';
  }
  h += '<button class="btn sec block" data-addsched style="margin-top:6px">+ Nytt schema från ett datum</button>' +
    '<p class="help">Varje dag räknas med det schema som gällde då, så historiken ändras inte när du byter schema. Ändrar du i ett schema som redan har loggade dagar får du välja om ändringen ska gälla från ett datum eller rätta hela perioden.</p></div>';
  h += '<div class="sectionlbl">Förslag till flexappen</div><div class="card">' +
    '<div class="row between"><span>Rast att lägga till (min)</span><input type="number" min="0" step="5" style="width:90px" data-lunch value="' + S.lunch + '"></div>' +
    '<p class="help">Om flexappen drar av lunch automatiskt: ange minuterna så blir utstämplingen så mycket senare.</p>' +
    '<p class="help">Gäller dagar utan normal arbetstid. ”Dagen före/efter” = närmaste arbetsdag inom samma vecka.</p></div>';
  h += '<div class="sectionlbl">Data</div><div class="card">' +
    '<button class="btn block" data-savebk>Spara säkerhetskopia</button>' +
    '<button class="btn sec block" data-restore style="margin-top:8px">Återställ från säkerhetskopia</button>' +
    '<button class="btn sec block" data-csv style="margin-top:8px">Kopiera alla poster som CSV</button>' +
    '<p class="help">Allt sparas bara i den här telefonen. Spara en säkerhetskopia regelbundet, till exempel i Filer/iCloud Drive. ' + (lastBackup() ? 'Senaste: ' + esc(longDate(lastBackup())) + '.' : 'Ingen säkerhetskopia sparad än.') + '</p></div>';
  h += '<p class="help" style="text-align:center;margin:18px 0 6px">Flexlogg ' + APP_VERSION + '</p>';
  return h;
}

/* ---------- scheman ---------- */
function schedRange(j) {  // [från, till) som dk-strängar
  return [S.schedules[j].from || '0000-00-00', S.schedules[j + 1] ? S.schedules[j + 1].from : '9999-99-99'];
}
function schedHasPast(j) {
  const [a, b] = schedRange(j), today = dk(Date.now());
  return E.some(e => { const k = dk(e.start); return isWork(cat(e.cat)) && k >= a && k < b && k < today; });
}
function addSchedule(from, hours) {
  const ex = S.schedules.find(x => x.from === from);
  if (ex) ex.hours = hours; else S.schedules.push({ from, hours });
  S.schedules.sort((a, b) => (a.from || '').localeCompare(b.from || '')); S.schedules[0].from = '';
}
function changeHours(key, field, value) {
  const [j, i] = key.split(':').map(Number);
  const apply = hours => { hours[i][field] = value; };
  if (!schedHasPast(j)) { apply(S.schedules[j].hours); commitSettings(); return render(); }
  const [a, b] = schedRange(j);
  const today = dk(Date.now());
  const def = today > a && today < b ? today : '';
  openModal('<h3>Ändra normal arbetstid</h3><p class="help">Det här schemat har redan loggade dagar. Hur ska ändringen (' + WDL[i] + ') gälla?</p>' +
    '<label>Nytt schema från</label><input type="date" id="sFrom" value="' + def + '">' +
    '<button class="btn block" id="sNew" style="margin-top:12px">Gäller från datumet ovan</button>' +
    '<button class="btn sec block" id="sFix" style="margin-top:8px">Rätta hela perioden (ändrar historiken)</button>' +
    '<button class="btn sec block" id="sCancel" style="margin-top:8px">Avbryt</button>', r => {
    r.querySelector('#sCancel').onclick = () => { closeModal(); render(); };
    r.querySelector('#sFix').onclick = () => { apply(S.schedules[j].hours); commitSettings(); closeModal(); render(); };
    r.querySelector('#sNew').onclick = () => {
      const f = r.querySelector('#sFrom').value;
      if (!f || f <= a || f >= b) { toast('Välj ett datum inom schemats period (efter dess startdatum).'); return; }
      const hours = clone(S.schedules[j].hours); apply(hours);
      addSchedule(f, hours); commitSettings(); closeModal(); render(); toast('Nytt schema från ' + dm(dkToMs(f)));
    };
  });
}

/* ---------- säkerhetskopia ---------- */
async function saveBackup() {
  const d = new Date();
  const name = 'flexlogg-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json';
  const txt = JSON.stringify({ app: 'flexlogg', v: 1, saved: d.toISOString(), S, E, T });
  const done = () => { try { localStorage.setItem(LBK, String(Date.now())); } catch (e) {} setSync(); render(); toast('Säkerhetskopia sparad'); };
  try {
    const file = new File([txt], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return done();
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const url = URL.createObjectURL(new Blob([txt], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    done();
  } catch (e) { copyText(txt); }
}

/* ---------- events ---------- */
$('#nav').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-tab]'); if (!b) return;
  tab = b.dataset.tab; saveLocal(); render(); window.scrollTo(0, 0);
});
const view = $('#view');
view.addEventListener('click', ev => {
  const t = ev.target.closest('[data-press],[data-chip],[data-logweek],[data-edit],[data-add],[data-week],[data-copyday],[data-copyweek],[data-mark],[data-unmark],[data-markall],[data-gotoweek],[data-up],[data-down],[data-del],[data-unarch],[data-addcat],[data-csv],[data-savebk],[data-restore],[data-addsched],[data-sdel],[data-skind],[data-sstep],[data-cmode],[data-bar]');
  if (!t) return;
  const d = t.dataset;
  if (d.press) return press(d.press);
  if (d.chip) {
    if (d.chip === 'now') SM = { kind: 'now' };
    else if (d.chip === 'abs') SM = { kind: 'abs', ms: Math.floor(Date.now() / MIN) * MIN };
    else SM = { kind: 'offset', min: Number(d.chip) };
    render();
    if (SM.kind === 'abs') { const i = $('#absInput'); i && i.focus(); }
    return;
  }
  if (d.logweek != null) { logWeek = d.logweek === '0' ? weekMonday(Date.now()) : addDays(logWeek, 7 * Number(d.logweek)); return render(); }
  if (d.edit) return editEntry(d.edit);
  if (d.add != null) { logDay = Number(d.add) || dayStart(Date.now()); return editEntry(null); }
  if (d.week != null) { flexWeek = d.week === '0' ? weekMonday(Date.now()) : addDays(flexWeek, 7 * Number(d.week)); return render(); }
  if (d.mark || d.unmark || d.markall != null) {
    const its = weekItems(weekData(flexWeek), flexWeek);
    if (d.unmark) delete T[d.unmark];
    else its.filter(it => it.cur && (d.markall != null ? it.state !== 'done' : it.key === d.mark)).forEach(markItem);
    commit(); return render();
  }
  if (d.gotoweek) { flexWeek = Number(d.gotoweek); render(); window.scrollTo(0, 0); return; }
  if (d.copyweek != null) return copyText(weekText(weekData(flexWeek), flexWeek));
  if (d.copyday != null) {
    const w = weekData(flexWeek), i = Number(d.copyday), p = w.props[i];
    if (p) copyText(WD[i] + ' ' + dm(w.days[i].day) + ': In ' + clock(p.in) + '  Ut ' + clock(p.out) + '  (' + fmtDur(p.dur) + ')');
    return;
  }
  if (d.up != null || d.down != null) {
    const i = Number(d.up ?? d.down), j = d.up != null ? i - 1 : i + 1;
    if (j < 0 || j >= S.categories.length) return;
    [S.categories[i], S.categories[j]] = [S.categories[j], S.categories[i]];
    commitSettings(); return render();
  }
  if (d.del != null) {
    const i = Number(d.del), c = S.categories[i];
    if (!t.dataset.sure) { t.dataset.sure = 1; t.textContent = 'Säker?'; return; }
    E.filter(e => e.cat === c.id && e.end == null).forEach(e => { e.end = Date.now(); commitEntries(e); });
    if (E.some(e => e.cat === c.id)) c.archived = true; else S.categories.splice(i, 1);
    S.categories.forEach(x => { if (x.parent === c.id && !cat(c.id)) x.parent = ''; });
    commitSettings(); return render();
  }
  if (d.unarch != null) { delete S.categories[Number(d.unarch)].archived; commitSettings(); return render(); }
  if (d.addcat != null) {
    const firstWork = S.categories.find(c => c.type === 'work' && !c.archived);
    S.categories.push({ id: newId(), name: 'Ny kategori', type: firstWork ? 'sub' : 'work', parent: firstWork ? firstWork.id : '', color: PALETTE[S.categories.length % PALETTE.length] });
    commitSettings(); render();
    const inputs = view.querySelectorAll('[data-cn]'); const last = inputs[inputs.length - 1]; if (last) { last.focus(); last.select(); }
    return;
  }
  if (d.csv != null) {
    const rows = [['datum', 'kategori', 'typ', 'start', 'slut', 'minuter'].join(';')];
    const tn = { work: 'arbetstid', sub: 'delkategori', other: 'ej arbetstid' };
    E.slice().sort((a, b) => a.start - b.start).forEach(e => {
      const c = cat(e.cat) || { name: '?', type: '' };
      const ds = new Date(e.start);
      rows.push([ds.getFullYear() + '-' + pad(ds.getMonth() + 1) + '-' + pad(ds.getDate()), c.name, tn[c.type] || '', clock(e.start), e.end == null ? '' : (dayStart(e.end) === dayStart(e.start) ? '' : dm(e.end) + ' ') + clock(e.end), e.end == null ? '' : Math.round((e.end - e.start) / MIN)].join(';'));
    });
    return copyText(rows.join('\n'));
  }
  if (d.savebk != null) return saveBackup();
  if (d.addsched != null) {
    openModal('<h3>Nytt schema</h3><p class="help">Det nya schemat startar som en kopia av det som gäller då. Ändra sedan tiderna.</p><label>Gäller från</label><input type="date" id="nFrom" value="' + dk(Date.now()) + '"><div class="row" style="margin-top:12px;gap:8px"><button class="btn sec" id="nCancel" style="margin-left:auto">Avbryt</button><button class="btn" id="nOk">Skapa</button></div>', r => {
      r.querySelector('#nCancel').onclick = closeModal;
      r.querySelector('#nOk').onclick = () => {
        const f = r.querySelector('#nFrom').value;
        if (!f) { toast('Välj ett datum.'); return; }
        if (S.schedules.some(x => x.from === f)) { toast('Det finns redan ett schema från det datumet.'); return; }
        addSchedule(f, clone(S.schedules[schedIdxFor(dkToMs(f))].hours));
        commitSettings(); closeModal(); render();
      };
    });
    return;
  }
  if (d.sdel != null) {
    if (!t.dataset.sure) { t.dataset.sure = 1; t.textContent = 'Säker?'; return; }
    S.schedules.splice(Number(d.sdel), 1); commitSettings(); return render();
  }
  if (d.skind) { statKind = d.skind; statAnchor = Date.now(); statSel = null; return render(); }
  if (d.sstep != null) { statAnchor = d.sstep === '0' ? Date.now() : shiftPeriod(statKind, periodRange(statKind, statAnchor)[0], Number(d.sstep)); statSel = null; return render(); }
  if (d.cmode) { chartMode = d.cmode; return render(); }
  if (d.bar != null) { statSel = statSel === Number(d.bar) ? null : Number(d.bar); return render(); }
  if (d.restore != null) {
    openModal('<h3>Återställ</h3><p class="help">Välj en säkerhetskopia (.json). Allt nuvarande i appen ersätts.</p><input type="file" id="rFile" accept=".json,application/json,text/plain"><label>…eller klistra in texten</label><textarea id="rTxt" rows="4"></textarea><div class="row" style="margin-top:12px;gap:8px"><button class="btn sec" id="rCancel" style="margin-left:auto">Avbryt</button><button class="btn danger" id="rOk">Ersätt</button></div>', r => {
      r.querySelector('#rCancel').onclick = closeModal;
      r.querySelector('#rFile').onchange = async ev => { const f = ev.target.files[0]; if (f) r.querySelector('#rTxt').value = await f.text(); };
      r.querySelector('#rOk').onclick = () => {
        try {
          const o = JSON.parse(r.querySelector('#rTxt').value);
          if (!o || !o.S || !Array.isArray(o.E)) throw 0;
          S = normalizeSettings(o.S); E = o.E; T = (o.T && typeof o.T === 'object') ? o.T : {};
          commit(); closeModal(); render(); toast('Återställt');
        } catch (e) { toast('Kunde inte läsa säkerhetskopian.'); }
      };
    });
  }
});
view.addEventListener('change', ev => {
  const t = ev.target, d = t.dataset;
  if (t.id === 'absInput') { const ms = fromInput(t.value); if (ms != null) { SM = { kind: 'abs', ms }; $('#stampShow').textContent = stampLabel(); } return; }
  if (d.cn != null) { S.categories[Number(d.cn)].name = t.value.trim() || 'Namnlös'; commitSettings(); return; }
  if (d.cc != null) { S.categories[Number(d.cc)].color = t.value; commitSettings(); return; }
  if (d.ct != null) {
    const c = S.categories[Number(d.ct)]; c.type = t.value;
    if (c.type === 'sub' && !c.parent) { const w = S.categories.find(x => x.type === 'work' && x.id !== c.id); c.parent = w ? w.id : ''; }
    if (c.type !== 'work') S.categories.forEach(x => { if (x.parent === c.id) x.parent = ''; });
    commitSettings(); return render();
  }
  if (d.cp != null) { S.categories[Number(d.cp)].parent = t.value; commitSettings(); return; }
  if (d.cnote != null) { const c = S.categories[Number(d.cnote)]; if (t.checked) c.note = true; else delete c.note; commitSettings(); return render(); }
  if (d.cprompt != null) { const c = S.categories[Number(d.cprompt)], v = t.value.trim(); if (v) c.notePrompt = v; else delete c.notePrompt; commitSettings(); return; }
  if (d.hon != null) return changeHours(d.hon, 'on', t.checked);
  if (d.hs != null) return changeHours(d.hs, 'start', t.value);
  if (d.he != null) return changeHours(d.he, 'end', t.value);
  if (d.sfrom != null) {
    const j = Number(d.sfrom), v = t.value;
    if (!v || S.schedules.some((x, k) => k !== j && x.from === v)) { toast('Ogiltigt eller upptaget datum.'); return render(); }
    S.schedules[j].from = v; S.schedules.sort((a, b) => (a.from || '').localeCompare(b.from || '')); S.schedules[0].from = '';
    commitSettings(); return render();
  }
  if (d.lunch != null) { S.lunch = Math.max(0, Number(t.value) || 0); commitSettings(); return; }
});

/* ---------- ticking clock ---------- */
setInterval(() => {
  if (tab !== 'stampla' || $('#modalRoot').innerHTML) return;
  const now = Date.now();
  document.querySelectorAll('[data-run]').forEach(el => { el.textContent = fmtRun(now - Number(el.dataset.run)); });
  if (E.some(e => e.end == null)) {
    const s = daySummary(dayStart(now));
    const a = $('#tTotal'), b = $('#tOut'); if (a) a.textContent = fmtDur(s.total); if (b) b.textContent = fmtDur(s.outside);
  }
  const ss = $('#stampShow'); if (ss && SM.kind !== 'abs') ss.textContent = stampLabel();
}, 1000);

/* ---------- start ---------- */
loadLocal();
render();
setSync();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
